<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top Arc Text Path for "โรงเรียนอัสสัมชัญอุบลราชธานี" -->
    <!-- Center (250, 250), radius ~215, sweeping clockwise across the top -->
    <path id="top-arc-path" d="M 50,250 A 200,200 0 0,1 450,250" fill="none" />
    
    <!-- Bottom Arc Text Path for "อำเภอเมือง  จังหวัดอุบลราชธานี" -->
    <!-- Sweeping along the bottom white banner -->
    <path id="bottom-arc-path" d="M 68,265 A 195,195 0 0,0 432,265" fill="none" />

    <!-- Gradients for realistic heraldic shading -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099"/>
      <stop offset="35%" stop-color="#F5C518"/>
      <stop offset="75%" stop-color="#D49B00"/>
      <stop offset="100%" stop-color="#9A6B00"/>
    </linearGradient>

    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6A8"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D49000"/>
    </linearGradient>

    <linearGradient id="red-banner-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E82424"/>
      <stop offset="100%" stop-color="#C21212"/>
    </linearGradient>

    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ================= 0. WHITE CIRCULAR BACKGROUND SIZED TO LOGO ================= -->
  <circle cx="250" cy="250" r="238" fill="#FFFFFF" />

  <!-- ================= TOP RED ARCH BANNER ================= -->
  <g filter="url(#drop-shadow)">
    <!-- Main red curved banner -->
    <!-- Arc from ~165 deg to 15 deg (sweeping top) with width 52px -->
    <path d="
      M 32,246
      C 32,125 130,28 250,28
      C 370,28 468,125 468,246
      L 484,244
      C 478,266 462,274 448,278
      L 444,242
      C 440,140 355,62 250,62
      C 145,62 60,140 56,242
      L 52,278
      C 38,274 22,266 16,244
      Z" 
      fill="url(#red-banner-grad)" 
      stroke="#960E0E" 
      stroke-width="1.5"
    />
    
    <!-- Left ribbon tail fold -->
    <path d="M 16,244 L 56,242 L 52,278 L 36,262 Z" fill="#9B0B0B" stroke="#680505" stroke-width="1"/>
    <path d="M 16,244 L 36,262 L 18,274 Z" fill="#FFFFFF" stroke="#960E0E" stroke-width="1"/>

    <!-- Right ribbon tail fold -->
    <path d="M 484,244 L 444,242 L 448,278 L 464,262 Z" fill="#9B0B0B" stroke="#680505" stroke-width="1"/>
    <path d="M 484,244 L 464,262 L 482,274 Z" fill="#FFFFFF" stroke="#960E0E" stroke-width="1"/>

    <!-- Inner gold/white border line on red banner -->
    <path d="
      M 60,234
      C 64,142 148,68 250,68
      C 352,68 436,142 440,234"
      fill="none" 
      stroke="#FFD54F" 
      stroke-width="1.5"
      stroke-opacity="0.8"
    />
  </g>

  <!-- Text inside Top Red Banner: "โรงเรียนอัสสัมชัญอุบลราชธานี" -->
  <text fill="#FFFFFF" font-family="'Prompt', 'Kanit', 'Sarabun', 'Thonburi', sans-serif" font-weight="800" font-size="27px" letter-spacing="1.5px">
    <textPath href="#top-arc-path" startOffset="50%" text-anchor="middle">
      โรงเรียนอัสสัมชัญอุบลราชธานี
    </textPath>
  </text>

  <!-- ================= GREEN LAUREL WREATH (LEFT & RIGHT) ================= -->
  <g id="laurel-wreath">
    <!-- Left laurel branch -->
    <g fill="#238823" stroke="#145214" stroke-width="0.8">
      <path d="M 112,230 C 95,200 102,170 120,150 C 122,165 118,185 116,205 Z" fill="#2E9E2E"/>
      <path d="M 104,245 C 85,230 92,205 108,190 C 110,210 108,230 106,245 Z"/>
      <path d="M 118,275 C 96,265 96,235 110,218 C 116,238 118,258 120,275 Z" fill="#2E9E2E"/>
      <path d="M 132,305 C 110,300 105,270 120,250 C 128,270 132,290 134,305 Z"/>
      <path d="M 152,328 C 130,328 122,302 136,280 C 146,298 152,315 154,328 Z" fill="#2E9E2E"/>
      <!-- Inner leaves -->
      <path d="M 135,178 C 125,162 135,145 152,148 C 145,160 142,172 135,178 Z"/>
      <path d="M 128,212 C 115,198 122,182 140,182 C 135,195 132,206 128,212 Z" fill="#38A138"/>
      <path d="M 132,246 C 118,232 122,216 142,214 C 138,228 136,240 132,246 Z"/>
      <path d="M 142,278 C 128,266 130,248 150,244 C 148,258 146,270 142,278 Z" fill="#38A138"/>
    </g>

    <!-- Right laurel branch (mirrored) -->
    <g fill="#238823" stroke="#145214" stroke-width="0.8" transform="translate(500,0) scale(-1,1)">
      <path d="M 112,230 C 95,200 102,170 120,150 C 122,165 118,185 116,205 Z" fill="#2E9E2E"/>
      <path d="M 104,245 C 85,230 92,205 108,190 C 110,210 108,230 106,245 Z"/>
      <path d="M 118,275 C 96,265 96,235 110,218 C 116,238 118,258 120,275 Z" fill="#2E9E2E"/>
      <path d="M 132,305 C 110,300 105,270 120,250 C 128,270 132,290 134,305 Z"/>
      <path d="M 152,328 C 130,328 122,302 136,280 C 146,298 152,315 154,328 Z" fill="#2E9E2E"/>
      <!-- Inner leaves -->
      <path d="M 135,178 C 125,162 135,145 152,148 C 145,160 142,172 135,178 Z"/>
      <path d="M 128,212 C 115,198 122,182 140,182 C 135,195 132,206 128,212 Z" fill="#38A138"/>
      <path d="M 132,246 C 118,232 122,216 142,214 C 138,228 136,240 132,246 Z"/>
      <path d="M 142,278 C 128,266 130,248 150,244 C 148,258 146,270 142,278 Z" fill="#38A138"/>
    </g>
  </g>

  <!-- ================= TOP CROWN / PEDIMENT (MONTFORT CREST) ================= -->
  <g id="crown-pediment" stroke="#5C3B00" stroke-width="1.2">
    <!-- Base scroll -->
    <path d="M 205,150 C 220,144 250,142 250,142 C 250,142 280,144 295,150 C 285,156 250,158 250,158 C 250,158 215,156 205,150 Z" fill="url(#gold-grad)"/>
    <!-- Middle tier -->
    <path d="M 215,142 C 220,126 235,116 250,116 C 265,116 280,126 285,142 C 275,145 250,146 250,146 C 250,146 225,145 215,142 Z" fill="url(#gold-bright)"/>
    <!-- Center top ornament & cross -->
    <circle cx="250" cy="110" r="5" fill="url(#gold-grad)"/>
    <path d="M 248,94 L 252,94 L 252,106 L 248,106 Z M 244,98 L 256,98 L 256,102 L 244,102 Z" fill="#FFD700"/>
    <!-- Side scrolls -->
    <path d="M 218,124 C 208,110 220,95 232,106 C 224,110 222,118 218,124 Z" fill="url(#gold-grad)"/>
    <path d="M 282,124 C 292,110 280,95 268,106 C 276,110 278,118 282,124 Z" fill="url(#gold-grad)"/>
    <!-- Crown filigree details -->
    <circle cx="230" cy="132" r="3" fill="#FFE082"/>
    <circle cx="250" cy="130" r="4" fill="#FFF59D"/>
    <circle cx="270" cy="132" r="3" fill="#FFE082"/>
  </g>

  <!-- ================= MAIN GOLDEN CARTOUCHE / SHIELD FRAME ================= -->
  <g id="shield-frame" filter="url(#drop-shadow)">
    <!-- Ornate outer gold frame with rococo scrolls -->
    <path d="
      M 160,152
      C 180,142 220,150 250,148
      C 280,150 320,142 340,152
      C 362,166 352,205 348,220
      C 365,245 362,280 342,305
      C 325,326 285,348 250,356
      C 215,348 175,326 158,305
      C 138,280 135,245 152,220
      C 148,205 138,166 160,152
      Z" 
      fill="url(#gold-grad)" 
      stroke="#784E00" 
      stroke-width="2.5"
    />

    <!-- Inner gold border / bevel highlight -->
    <path d="
      M 170,162
      C 190,154 225,160 250,158
      C 275,160 310,154 330,162
      C 345,176 338,206 336,220
      C 348,242 346,270 330,292
      C 314,312 280,332 250,340
      C 220,332 186,312 170,292
      C 154,270 152,242 164,220
      C 162,206 155,176 170,162
      Z" 
      fill="none" 
      stroke="#FFE57F" 
      stroke-width="2"
    />

    <!-- Frame corner scrolls / flourishes -->
    <circle cx="152" cy="165" r="7" fill="url(#gold-bright)" stroke="#784E00" stroke-width="1.5"/>
    <circle cx="348" cy="165" r="7" fill="url(#gold-bright)" stroke="#784E00" stroke-width="1.5"/>
  </g>

  <!-- ================= THE 4 QUADRANTS OF THE SHIELD ================= -->
  <!-- Clip path to keep heraldic quadrants strictly within inner shield -->
  <clipPath id="inner-shield-clip">
    <path d="
      M 185,168
      L 315,168
      C 325,190 325,230 325,250
      C 325,285 295,315 250,332
      C 205,315 175,285 175,250
      C 175,230 175,190 185,168
      Z"
    />
  </clipPath>

  <g clip-path="url(#inner-shield-clip)">
    <!-- Quadrant 1: Top-Left (Royal Blue) -->
    <rect x="175" y="168" width="75" height="82" fill="#143E82" />
    
    <!-- Quadrant 2: Top-Right (White) -->
    <rect x="250" y="168" width="75" height="82" fill="#FFFFFF" />

    <!-- Quadrant 3: Bottom-Left (White) -->
    <rect x="175" y="250" width="75" height="82" fill="#FFFFFF" />

    <!-- Quadrant 4: Bottom-Right (Red) -->
    <rect x="250" y="250" width="75" height="82" fill="#D32F2F" />

    <!-- Quadrant Divider Grid Lines -->
    <line x1="250" y1="168" x2="250" y2="332" stroke="#2B2B2B" stroke-width="1.8" />
    <line x1="175" y1="250" x2="325" y2="250" stroke="#2B2B2B" stroke-width="1.8" />

    <!-- ================= HERALDIC SYMBOLS IN QUADRANTS ================= -->

    <!-- --- Q1 (Top-Left): AM MONOGRAM (Auspice Maria) + LILY FLOWER --- -->
    <g id="quadrant-1-symbol">
      <!-- Lily flower atop AM -->
      <path d="M 212,176 C 207,172 208,180 212,185 C 216,180 217,172 212,176 Z" fill="#FDD835" stroke="#F57F17" stroke-width="0.6"/>
      <path d="M 205,178 C 201,176 204,183 209,185 C 207,180 205,178 205,178 Z" fill="#FDD835"/>
      <path d="M 219,178 C 223,176 220,183 215,185 C 217,180 219,178 219,178 Z" fill="#FDD835"/>
      <!-- Stem -->
      <line x1="212" y1="185" x2="212" y2="192" stroke="#FDD835" stroke-width="1.2"/>

      <!-- Interlocked AM Monogram -->
      <!-- 'A' -->
      <path d="M 202,236 L 212,192 L 222,236 L 217,236 L 214.5,224 L 209.5,224 L 207,236 Z M 212,205 L 210.5,219 L 213.5,219 Z" fill="#FDD835" stroke="#F57F17" stroke-width="0.8"/>
      <!-- 'M' interlocking -->
      <path d="M 197,236 L 197,204 L 204,222 L 212,204 L 220,222 L 227,204 L 227,236 L 223,236 L 223,212 L 217,226 L 212,214 L 207,226 L 201,212 L 201,236 Z" fill="#FFE082" stroke="#F57F17" stroke-width="0.6" fill-opacity="0.95"/>
    </g>

    <!-- --- Q2 (Top-Right): SCALES OF JUSTICE + WAVES --- -->
    <g id="quadrant-2-symbol" stroke="#A16207">
      <!-- Triangle balance apex -->
      <polygon points="287,178 281,190 293,190" fill="#FACC15" stroke="#A16207" stroke-width="1.2"/>
      <circle cx="287" cy="189" r="1.5" fill="#854D0E"/>
      <!-- Balance beam -->
      <line x1="262" y1="198" x2="312" y2="198" stroke="#854D0E" stroke-width="1.8"/>
      <!-- Left pan chains & triangular pan -->
      <line x1="262" y1="198" x2="258" y2="210" stroke="#A16207" stroke-width="0.9"/>
      <line x1="262" y1="198" x2="266" y2="210" stroke="#A16207" stroke-width="0.9"/>
      <path d="M 255,210 Q 262,216 269,210 Z" fill="#FACC15" stroke="#854D0E" stroke-width="1"/>
      <!-- Right pan chains & triangular pan -->
      <line x1="312" y1="198" x2="308" y2="210" stroke="#A16207" stroke-width="0.9"/>
      <line x1="312" y1="198" x2="316" y2="210" stroke="#A16207" stroke-width="0.9"/>
      <path d="M 305,210 Q 312,216 319,210 Z" fill="#FACC15" stroke="#854D0E" stroke-width="1"/>
      <!-- Water waves under scales -->
      <path d="M 264,228 Q 275,224 286,228 T 308,228" fill="none" stroke="#CA8A04" stroke-width="1.2"/>
      <path d="M 267,234 Q 278,230 289,234 T 305,234" fill="none" stroke="#CA8A04" stroke-width="1"/>
    </g>

    <!-- --- Q3 (Bottom-Left): RADIANT SUN + SAILING BOAT ON WAVES --- -->
    <g id="quadrant-3-symbol">
      <!-- Sun disc -->
      <circle cx="212" cy="274" r="7" fill="#FACC15" stroke="#CA8A04" stroke-width="1"/>
      <!-- Sun rays (straight and diagonal) -->
      <g stroke="#EAB308" stroke-width="1.2" stroke-linecap="round">
        <line x1="212" y1="262" x2="212" y2="258"/>
        <line x1="212" y1="286" x2="212" y2="290"/>
        <line x1="200" y1="274" x2="196" y2="274"/>
        <line x1="224" y1="274" x2="228" y2="274"/>
        <line x1="203" y1="265" x2="200" y2="262"/>
        <line x1="221" y1="265" x2="224" y2="262"/>
        <line x1="203" y1="283" x2="200" y2="286"/>
        <line x1="221" y1="283" x2="224" y2="286"/>
      </g>
      <!-- Sailing Boat / Barque floating on water -->
      <path d="M 197,300 C 205,307 219,307 227,300 L 224,296 L 200,296 Z" fill="#FACC15" stroke="#854D0E" stroke-width="1"/>
      <!-- Waves below boat -->
      <path d="M 188,310 Q 200,306 212,310 T 236,310" fill="none" stroke="#A16207" stroke-width="1.2"/>
      <path d="M 192,315 Q 204,312 216,315 T 232,315" fill="none" stroke="#A16207" stroke-width="1"/>
    </g>

    <!-- --- Q4 (Bottom-Right): LATIN CROSS + D | S MONOGRAM (Dieu Seul) --- -->
    <g id="quadrant-4-symbol">
      <!-- Latin Cross in bright gold -->
      <path d="
        M 284,258 L 290,258 L 290,270 L 302,270 L 302,276 L 290,276 L 290,314 L 284,314 L 284,276 L 272,276 L 272,270 L 284,270 Z" 
        fill="#FFEB3B" 
        stroke="#FFE082" 
        stroke-width="0.8"
      />
      <!-- 'D' letter on the left of cross -->
      <text x="260" y="296" font-family="'Times New Roman', serif" font-weight="bold" font-size="22px" fill="#FFEB3B" text-anchor="middle">
        D
      </text>
      <!-- 'S' letter on the right of cross -->
      <text x="312" y="296" font-family="'Times New Roman', serif" font-weight="bold" font-size="22px" fill="#FFEB3B" text-anchor="middle">
        S
      </text>
    </g>
  </g>

  <!-- ================= MOTTO RIBBONS ACROSS LOWER SHIELD ================= -->
  <g id="motto-ribbons" filter="url(#drop-shadow)">
    <!-- 1. Upper Yellow Ribbon: "BROTHERS of St GABRIEL" -->
    <g>
      <!-- Curved banner ribbon base -->
      <path d="
        M 160,332
        C 195,316 305,316 340,332
        L 344,352
        C 305,334 195,334 156,352
        Z" 
        fill="url(#gold-bright)" 
        stroke="#784E00" 
        stroke-width="1.5"
      />
      <!-- Ribbon swallowtail ends -->
      <path d="M 156,352 L 140,344 L 146,362 L 164,360 Z" fill="#D49B00" stroke="#784E00" stroke-width="1"/>
      <path d="M 344,352 L 360,344 L 354,362 L 336,360 Z" fill="#D49B00" stroke="#784E00" stroke-width="1"/>

      <!-- Text: BROTHERS of St GABRIEL -->
      <path id="brothers-ribbon-path" d="M 162,345 C 205,327 295,327 338,345" fill="none"/>
      <text font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#1A1A1A" letter-spacing="0.5px">
        <textPath href="#brothers-ribbon-path" startOffset="50%" text-anchor="middle">
          BROTHERS of   St GABRIEL
        </textPath>
      </text>
    </g>

    <!-- Crossed torch / baton handles beneath ribbon -->
    <g stroke="#784E00" stroke-width="3" stroke-linecap="round">
      <line x1="205" y1="345" x2="185" y2="380"/>
      <line x1="295" y1="345" x2="315" y2="380"/>
    </g>

    <!-- 2. Lower Yellow Ribbon: "LABOR OMNIA VINCIT" -->
    <g>
      <!-- Undulating Ribbon shape -->
      <path d="
        M 172,364
        C 200,378 225,378 250,388
        C 275,378 300,378 328,364
        L 334,384
        C 305,398 275,398 250,408
        C 225,398 195,398 166,384
        Z" 
        fill="url(#gold-bright)" 
        stroke="#784E00" 
        stroke-width="1.5"
      />
      <!-- Left and right ribbon folds -->
      <path d="M 166,384 L 148,374 L 152,396 L 174,394 Z" fill="#D49B00" stroke="#784E00" stroke-width="1"/>
      <path d="M 334,384 L 352,374 L 348,396 L 326,394 Z" fill="#D49B00" stroke="#784E00" stroke-width="1"/>

      <!-- Text: LABOR OMNIA VINCIT -->
      <!-- Left fold: LABOR -->
      <text x="202" y="386" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#1A1A1A" text-anchor="middle">
        LABOR
      </text>
      <!-- Center fold: OMNIA -->
      <text x="250" y="401" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#1A1A1A" text-anchor="middle">
        OMNIA
      </text>
      <!-- Right fold: VINCIT -->
      <text x="298" y="386" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#1A1A1A" text-anchor="middle">
        VINCIT
      </text>
    </g>
  </g>

  <!-- ================= BOTTOM WHITE BANNER ================= -->
  <!-- "อำเภอเมือง  จังหวัดอุบลราชธานี" with side red crosses -->
  <g id="bottom-white-banner" filter="url(#drop-shadow)">
    <!-- White curved banner arching upward under the crest -->
    <path d="
      M 62,310
      C 110,405 180,448 250,450
      C 320,448 390,405 438,310
      L 452,330
      C 400,432 325,482 250,484
      C 175,482 100,432 48,330
      Z" 
      fill="#FFFFFF" 
      stroke="#D32F2F" 
      stroke-width="2.5"
    />

    <!-- Ribbon tip notch / folds -->
    <path d="M 48,330 L 62,310 L 76,334 Z" fill="#FFCDD2" stroke="#D32F2F" stroke-width="1"/>
    <path d="M 452,330 L 438,310 L 424,334 Z" fill="#FFCDD2" stroke="#D32F2F" stroke-width="1"/>

    <!-- Left Red Cross Medallion -->
    <g transform="translate(98, 372)">
      <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#D32F2F" stroke-width="2"/>
      <!-- Montfort / St. Gabriel Cross (Pattée) -->
      <path d="
        M -2,-2 L -8,-8 L -6,-10 L 0,-4 L 6,-10 L 8,-8 L 2,-2 
        L 8,-2 L 10,-6 L 10,6 L 8,2 L 2,2 
        L 8,8 L 6,10 L 0,4 L -6,10 L -8,8 L -2,2 
        L -8,2 L -10,6 L -10,-6 L -8,-2 Z" 
        fill="#D32F2F" 
        transform="scale(0.8)"
      />
    </g>

    <!-- Right Red Cross Medallion -->
    <g transform="translate(402, 372)">
      <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#D32F2F" stroke-width="2"/>
      <!-- Montfort / St. Gabriel Cross (Pattée) -->
      <path d="
        M -2,-2 L -8,-8 L -6,-10 L 0,-4 L 6,-10 L 8,-8 L 2,-2 
        L 8,-2 L 10,-6 L 10,6 L 8,2 L 2,2 
        L 8,8 L 6,10 L 0,4 L -6,10 L -8,8 L -2,2 
        L -8,2 L -10,6 L -10,-6 L -8,-2 Z" 
        fill="#D32F2F" 
        transform="scale(0.8)"
      />
    </g>

    <!-- Text inside Bottom White Banner: "อำเภอเมือง  จังหวัดอุบลราชธานี" -->
    <!-- Custom text path sweeping bottom arch -->
    <path id="bottom-text-arc" d="M 115,396 C 180,455 320,455 385,396" fill="none"/>
    <text fill="#D32F2F" font-family="'Prompt', 'Kanit', 'Sarabun', 'Thonburi', sans-serif" font-weight="700" font-size="21px" letter-spacing="1px">
      <textPath href="#bottom-text-arc" startOffset="50%" text-anchor="middle">
        อำเภอเมือง   จังหวัดอุบลราชธานี
      </textPath>
    </text>
  </g>
</svg>
